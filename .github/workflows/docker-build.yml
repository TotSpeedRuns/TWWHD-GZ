name: Docker build checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -t twwhd-gz-builder .
      - run: |
          docker run --rm --platform linux/amd64 --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/project,readonly" twwhd-gz-builder --check
